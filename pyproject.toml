[project]
name = "jobpipe"
version = "0.1.0"
description = "Sammelt, normalisiert und rankt Schweizer Stelleninserate gegen ein persönliches Suchprofil."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "protego>=0.3",
    "selectolax>=0.3.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.15",
    "rich>=13.9",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
# Erst ab M3 nötig. Getrennt, damit M0-M2 ohne schwere Abhängigkeiten laufen.
enrich = [
    "numpy>=2.1",
    "scikit-learn>=1.6",
    "umap-learn>=0.5.7",
    "google-genai>=0.8",
]
# Lokaler, kostenloser Embedding-Fallback ohne API-Key.
local = [
    "sentence-transformers>=3.3",
]
ui = [
    "streamlit>=1.40",
    "jinja2>=3.1",
    "plotly>=5.24",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "pandas-stubs",
]

[project.scripts]
jobpipe = "jobpipe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpipe"]
artifacts = ["src/jobpipe/output/templates/*.j2"]

# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",
]
ignore = [
    "E501",  # line-length wird vom Formatter erledigt
    # Halbgeviertstriche und Mittelpunkte sind in deutschsprachigen
    # Stellentiteln Alltag; die Normalisierung muss sie treffen können.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["protego.*", "selectolax.*", "umap.*", "sentence_transformers.*", "sklearn.*", "streamlit.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: Test spricht echte Portale an (nicht in CI, nur manuell)",
]
