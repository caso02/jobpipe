# Skill-Wörterbuch für die Gap-Analyse.
#
# Bewusst eingecheckt und von Hand gepflegt: die Extraktion soll erklärbar
# sein. Wenn ein Skill erkannt wird, sieht man hier, woran das lag.
#
# Format:
#   kategorie:
#     - Einfacher Begriff
#     - Begriff mit Aliassen: [Alias1, Alias2]
#
# Aliasse fangen Schreibweisen ab, die dasselbe meinen. Ohne sie zählt
# "PostgreSQL" und "Postgres" als zwei verschiedene Anforderungen.

